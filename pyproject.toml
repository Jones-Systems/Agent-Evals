[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-evals"
version = "0.1.0"
description = "Portable deterministic records and grading for agent evaluations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jones Systems" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
agent-evals = "agent_evals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_evals/resources/skill-evaluation-v1.schema.json" = "agent_evals/resources/skill-evaluation-v1.schema.json"
